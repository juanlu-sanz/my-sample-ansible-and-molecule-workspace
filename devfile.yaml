schemaVersion: 2.2.0
metadata:
  name: my-ansible-workspace
  version: 1.0.0
  displayName: My Ansible Workspace
  description: Pre-configured Ansible development environment with ansible-dev-tools, molecule, and linting tools
  language: yaml
  projectType: ansible
attributes:
  controller.devfile.io/storage-type: per-workspace

components:
  - name: ansible-tools
    attributes:
      container-overrides:
        securityContext:
          privileged: true
    container:
      image: ghcr.io/juanlu-sanz/nested-podman-devspaces:latest
      memoryLimit: 4Gi
      cpuLimit: 1000m
      cpuRequest: 500m
      mountSources: true
      env:
        - name: CONTAINER_HOST
          value: ""
        - name: ANSIBLE_COLLECTIONS_PATH
          value: ${PROJECT_SOURCE}/.ansible/collections
        - name: ANSIBLE_ROLES_PATH
          value: ${PROJECT_SOURCE}/roles
        - name: ANSIBLE_HOST_KEY_CHECKING
          value: "false"
        - name: ANSIBLE_FORCE_COLOR
          value: "true"
        - name: PY_COLORS
          value: "1"
        - name: MOLECULE_NO_LOG
          value: "false"
        - name: TERM
          value: xterm-256color
      volumeMounts:
        - name: pip-cache
          path: /home/user/.cache/pip
        - name: ansible-data
          path: /home/user/.ansible

  - name: pip-cache
    volume:
      size: 2Gi

  - name: ansible-data
    volume:
      size: 2Gi

commands:
  - id: setup-ansible
    exec:
      component: ansible-tools
      commandLine: |
        pip install --user \
          ansible-dev-tools \
          "molecule-plugins[podman]" \
          pytest-testinfra \
          jmespath \
          netaddr &&
        if [ -f requirements.yml ]; then
          ansible-galaxy collection install -r requirements.yml --force
        fi &&
        echo "✅ Ansible tools installed successfully" &&
        adt --version
      workingDir: ${PROJECT_SOURCE}
      label: "Install Ansible Tools"
  - id: lint
    exec:
      component: ansible-tools
      commandLine: ansible-lint .
      workingDir: ${PROJECT_SOURCE}
      label: "Run Ansible Lint"
  - id: test
    exec:
      component: ansible-tools
      commandLine: molecule test
      workingDir: ${PROJECT_SOURCE}
      label: "Run Molecule Test"

events:
  postStart:
    - setup-ansible
